<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="drawer">
        <button onclick="show_section('register')" id="tab-register">Register</button>
        <button onclick="show_section('browse')" id="tab-browse">Browse Books</button>
        <button onclick="show_section('borrow')" id="tab-borrow">Borrow</button>
        <button onclick="show_section('return')" id="tab-return">Return</button>
    </div>

    <div id="register" class="section">
        <h1>Register as a Member</h1>
        <div class="field">
            <label>Name</label>
            <input type="text" id="r-name" placeholder="Your full name">
            <div class="err" id="e-name"></div>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" id="r-email" placeholder="you@example.com">
            <div class="err" id="e-email"></div>
        </div>
        <div class="field">
            <label>Birthday</label>
            <input type="date" id="r-bday">
            <div class="err" id="e-bday"></div>
        </div>
        <div class="field">
            <label>Library usage</label>
            <div class="checkbox-group">
                <label><input type="checkbox" value="Reference"> Reference</label>
                <label><input type="checkbox" value="In-house reading"> In-house reading</label>
                <label><input type="checkbox" value="Borrowing"> Borrowing</label>
            </div>
        </div>
        <div class="tos-row">
            <input type="checkbox" id="r-tos">
            <label for="r-tos">I agree to the Terms of Service</label>
        </div>
        <div class="err" id="e-tos"></div>
        <button onclick="register()">Register</button>
        <div class="ok" id="r-ok"></div>
    </div>

    <div id="browse" class="section">
        <h1>Browse Books</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="book-rows"></tbody>
        </table>
    </div>

    <div id="borrow" class="section">
        <h1>Borrow a Book</h1>
        <div class="field">
            <label>Member ID</label>
            <input type="text" id="b-mid" placeholder="Your member ID">
            <div class="err" id="e-bmid"></div>
        </div>
        <div class="field">
            <label>Book ID</label>
            <input type="text" id="b-bid" placeholder="Book ID">
            <div class="err" id="e-bbid"></div>
        </div>
        <div class="field">
            <label>Expected return date</label>
            <input type="date" id="b-ret">
            <div class="err" id="e-bret"></div>
        </div>
        <button onclick="borrowBook()">Borrow Now</button>
        <div class="ok" id="b-ok"></div>
    </div>

    <div id="return" class="section">
        <h1>Return a Book</h1>
        <div class="field">
            <label>Book ID</label>
            <input type="text" id="ret-bid" placeholder="Book ID">
            <div class="err" id="e-ret"></div>
        </div>
        <button onclick="returnBook()">Confirm Return</button>
        <div class="ok" id="ret-ok"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
